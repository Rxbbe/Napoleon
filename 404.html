<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf8f4">
<title>Pagina niet gevonden · Grand Bistro Napoleon</title>
<style>
:root{--paper:#faf8f4;--ink:#161514;--muted:#6e6a64;--line:#e2dcd2;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
header{padding:20px clamp(16px,4.5vw,56px);border-bottom:1px solid var(--line)}
header img{height:44px;width:auto;display:block}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1280px;width:100%;margin-inline:auto;padding:clamp(48px,8vw,112px) clamp(16px,4.5vw,56px)}
.label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,9vw,128px);line-height:.98;letter-spacing:-.02em;margin:18px 0 0;text-wrap:balance}
h1 em{font-style:italic}
p.lede{max-width:46ch;font-size:clamp(16px,1.6vw,19px);color:var(--muted);margin:24px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid var(--ink);transition:transform .16s cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.98)}
.btn-solid{background:var(--ink);color:var(--paper)}
.btn-line{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
footer{padding:20px clamp(16px,4.5vw,56px);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><a href="/" aria-label="Grand Bistro Napoleon, naar de startpagina"><img src="/afbeeldingen/napoleon-logo.svg" alt="Grand Bistro Napoleon"></a></header>
<main>
  <p class="label">Fout 404</p>
  <h1>Deze tafel is <em>niet gedekt.</em></h1>
  <p class="lede">De pagina die je zoekt bestaat niet (meer) of het adres is niet juist. Geen zorgen, de bistro zelf is gewoon open.</p>
  <div class="btns">
    <a class="btn btn-solid" href="/">Terug naar de startpagina</a>
    <a class="btn btn-line" href="/#menukaart">Menukaart</a>
    <a class="btn btn-line" href="/#contact">Adres &amp; uren</a>
  </div>
</main>
<footer>Grand Bistro Napoleon · Bernard Kempplein 4 · 3930 Hamont-Achel · <a href="tel:+3211730074" style="color:inherit">011 73 00 74</a></footer>
</body>
</html>
